<div class="surface-card p-4 shadow-2 border-round p-fluid mb-4" [formGroup]="form">
  <div class="grid formgrid p-fluid">
    <div class="field mb-4 col-12 md:col-6">
      <label for="solution" transloco="taskTypes.hierarchical-clustering.fields.nDataPoints"></label>
      <p-inputNumber inputId="nDataPoints" formControlName="nDataPoints" [maxFractionDigits]="0" />
      @if (form.controls.nDataPoints.dirty || form.controls.nDataPoints.touched) {
        <small class="block mt-1 p-error">
          {{ getError(form.controls.nDataPoints, 'taskTypes.hierarchical-clustering.fields.nDataPoints') }}
        </small>
      }
    </div>
  </div>
</div>
