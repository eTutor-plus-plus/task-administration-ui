<div class="surface-card p-4 shadow-2 border-round p-fluid mb-4" [formGroup]="form">
  <div class="grid formgrid p-fluid">
    <div class="field mb-4 col-12">
      <label for="maxPoints" transloco="taskGroupTypes.intensional-schema.fields.maxPoints"></label>
      <p-inputNumber id="maxPoints" inputId="maxPoints" formControlName="maxPoints" [min]="0" [maxFractionDigits]="2"/>
      @if (form.controls.maxPoints.dirty || form.controls.maxPoints.touched) {
        <small class="block mt-1 p-error">
          {{ getError(form.controls.maxPoints, 'taskGroupTypes.intensional-schema.fields.maxPoints') }}
        </small>
      }
    </div>
  </div>
</div>
